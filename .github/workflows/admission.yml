name: Reliability admission

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: Go 1.25 build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - run: bash scripts/ci/admission.sh

  race:
    name: Go 1.25 race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - run: bash scripts/ci/admission.sh --race

  migration-e2e:
    name: PostgreSQL durable-schema contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/docker-compose.backend-smoke.yml config --quiet
      - run: bash scripts/e2e/backend-adapter.sh migration

  runtime-e2e:
    name: PostgreSQL Redis takeover runtime slice
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/e2e/backend-adapter.sh runtime
